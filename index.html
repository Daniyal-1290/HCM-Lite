<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HCM Lite — Sign in</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="login">
    <div class="login-screen">
      <section class="login-art">
        <div class="brand">
          <span class="brand-mark">H</span>
          <span>
            HCM Lite
            <small>People, made simpler</small>
          </span>
        </div>
        <h1>
          Your people.<br>
          Your workplace.<br>
          One simple place.
        </h1>
        <p>A lightweight HR workspace for attendance, leave, employee records and monthly payroll.</p>
        <div style="margin-top: 30px">
          <span class="helper-chip">Employee self-service</span>
          <span class="helper-chip">Attendance tracking</span>
          <span class="helper-chip">Monthly payslips</span>
        </div>
      </section>
      <main class="login-main">
        <div class="login-box" id="login-area"></div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
